<svg xmlns="http://www.w3.org/2000/svg" width="648mm" height="648mm" viewBox="0 0 648 648" role="img" aria-label="Every part counted. Every well closed. — station layout and S01 supports" data-revision="09fea78b15c0c4e739531d45f71da52faa534e86e7d8d8d588a8959ef2f2bd6d"><title>Every part counted. Every well closed. — station layout and S01 supports</title><desc>Full-scale exterior stop templates and proposed tabletop layout. Origin is front-left, X right, Y away from operator. Cyan lines are placement references, not cuts.</desc><metadata>CounterShot exact revision 09fea78b15c0c4e739531d45f71da52faa534e86e7d8d8d588a8959ef2f2bd6d</metadata><defs><marker id="dimension-arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto-start-reverse"><path d="M0,0 L4,2 L0,4" fill="none" stroke="#64748b" stroke-width=".5"/></marker><pattern id="support-hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0,4 L4,0" stroke="#cbd5e1" stroke-width=".4"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:3.2px}.title{font-size:5px;font-weight:700}.small{font-size:2.8px}.muted{fill:#64748b}.cut{fill:none;stroke:#17212b;stroke-width:.45}.score{fill:none;stroke:#d97706;stroke-width:.4;stroke-dasharray:3 1.5}.dim{fill:none;stroke:#64748b;stroke-width:.25}.layout{fill:none;stroke:#0891b2;stroke-width:.4;stroke-dasharray:2 2}.support{fill:url(#support-hatch);stroke:#17212b;stroke-width:.3}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="10" class="title">COUNTERSHOT / EXTERIOR SUPPORTS</text><text x="24" y="17" class="small">Top-opening hinged-lid/tuck carton only. Check every flap, extraction and reset before admission.</text><rect x="24" y="24" width="600" height="450" class="layout"/><rect x="24" y="74" width="550" height="400" class="layout" fill="#ecfeff" fill-opacity=".5"/><rect x="114" y="249" width="185" height="165" class="layout"/><rect x="134.5" y="269.5" width="144" height="124" class="layout"/><text x="26" y="471" class="small">ORIGIN (0,0) · FRONT LEFT</text><line x1="24" y1="474" x2="69" y2="474" class="dim"/><text x="71" y="476" class="small">+X right</text><line x1="24" y1="474" x2="24" y2="439" class="dim"/><text x="26" y="438" class="small">+Y away</text><text x="572" y="470" class="small" text-anchor="end">CONFIRMED REACH RECTANGLE</text><rect x="164.3" y="334.3" width="42" height="32" class="layout"/><text x="185.3" y="347.3" class="small" text-anchor="middle">P02A</text><text x="185.3" y="353.3" class="small" text-anchor="middle">Screws × 4</text><rect x="209.3" y="334.3" width="37" height="32" class="layout"/><text x="227.8" y="347.3" class="small" text-anchor="middle">P02B</text><text x="227.8" y="353.3" class="small" text-anchor="middle">Washers × 4</text><rect x="166.8" y="299.3" width="37" height="32" class="layout"/><text x="185.3" y="312.3" class="small" text-anchor="middle">P02C</text><text x="185.3" y="318.3" class="small" text-anchor="middle">Spacers × 2</text><rect x="206.8" y="296.8" width="42" height="37" class="layout"/><text x="227.8" y="312.3" class="small" text-anchor="middle">P02D</text><text x="227.8" y="318.3" class="small" text-anchor="middle">Grommets × 2</text><rect x="114" y="333.5" width="20" height="60" class="support"/><rect x="134.5" y="249" width="60" height="20" class="support"/><text x="116" y="330.5">S01 · left</text><text x="134.5" y="246">S02 · rear</text><text x="114" y="422" class="small">Envelope origin X 90 mm / Y 60 mm</text><line x1="24" y1="485" x2="24" y2="491" class="dim"/><line x1="624" y1="485" x2="624" y2="491" class="dim"/><line x1="25" y1="488" x2="623" y2="488" class="dim" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="324" y="486" class="small" text-anchor="middle">Workspace 600 mm</text><text x="24" y="508" class="title">S01 + S02 / CUT TWO IDENTICAL L-SECTION STOPS</text><text x="24" y="515" class="small">Base foot 20 mm; upright 12 mm; signed fold correction 0 mm</text><rect x="24" y="522" width="60" height="32" class="cut"/><line x1="24" y1="542" x2="84" y2="542" class="score"/><text x="54" y="532" class="small" text-anchor="middle">TAPE FOOT TO TABLE</text><text x="54" y="548" class="small" text-anchor="middle">UPRIGHT</text><line x1="24" y1="560" x2="24" y2="566" class="dim"/><line x1="84" y1="560" x2="84" y2="566" class="dim"/><line x1="25" y1="563" x2="83" y2="563" class="dim" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="54" y="561" class="small" text-anchor="middle">60 mm</text><line x1="9" y1="522" x2="15" y2="522" class="dim"/><line x1="9" y1="554" x2="15" y2="554" class="dim"/><line x1="12" y1="523" x2="12" y2="553" class="dim" marker-start="url(#dimension-arrow)" marker-end="url(#dimension-arrow)"/><text x="10" y="538" class="small" text-anchor="middle" transform="rotate(-90 10 538)">32 mm</text><rect x="24" y="578" width="50" height="50" class="cut"/><text x="49" y="602" text-anchor="middle">50 × 50 mm</text><text x="49" y="608" class="small" text-anchor="middle">SCALE CHECK</text><text x="82" y="586">Solid = CUT · dashed amber = SCORE / FOLD</text><text x="82" y="594">Print at actual size / 100%. Measure the square.</text><text x="82" y="602">Oversize: use the dimensioned ruler-marking method.</text><text x="82" y="610" class="small">Proposed geometry. Physical fit and operation are untested.</text><text x="82" y="618" class="small">Revision 09fea78b15c0c4e7</text></svg>