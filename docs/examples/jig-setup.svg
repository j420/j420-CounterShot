<svg xmlns="http://www.w3.org/2000/svg" width="648mm" height="676mm" viewBox="0 0 648 676" role="img" aria-label="Let the jig hold the walls. Keep the hand for the joints. — exterior jig assembly and front release layout" data-revision="656b2d91295b3d5117e7a1f9cd2e8195b8bfc3e2cc74ca530b69d457d449d7c4" data-compiler="3.0.1"><title>Let the jig hold the walls. Keep the hand for the joints. — exterior jig assembly and front release layout</title><desc>Deterministic jig drawing. Solid lines cut; amber dashed lines score; cyan lines locate supplied workpieces and are never workpiece manufacturing instructions. Physical admission remains required.</desc><metadata>Exact revision 656b2d91295b3d5117e7a1f9cd2e8195b8bfc3e2cc74ca530b69d457d449d7c4; compiler 3.0.1</metadata><defs><pattern id="jig-hatch" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0,4L4,0" stroke="#b6c3cc" stroke-width=".4"/></pattern></defs><style>text{font:3.2px Arial,sans-serif;fill:#17212b}.title{font-size:5px;font-weight:700}.small{font-size:2.8px}.cut{fill:none;stroke:#17212b;stroke-width:.45}.score{fill:none;stroke:#d97706;stroke-width:.4;stroke-dasharray:3 1.5}.reference{fill:none;stroke:#0891b2;stroke-width:.35;stroke-dasharray:2 2}.support{fill:url(#jig-hatch);stroke:#17212b;stroke-width:.35}.contact{fill:#94a3b8;fill-opacity:.5;stroke:#475569;stroke-width:.3}.corridor{fill:#dcfce7;fill-opacity:.65;stroke:#16a34a;stroke-width:.35;stroke-dasharray:2 2}.ghost{fill:none;stroke:#d97706;stroke-width:.4;stroke-dasharray:3 2}.dim{stroke:#64748b;stroke-width:.25;fill:none}</style><rect width="100%" height="100%" fill="white"/><text x="24" y="10" class="title">WORKSHOP JIG / ASSEMBLY SETUP</text><text x="24" y="17" class="small">Initial state: gate PARKED. Amber ghost = engaged later. All permanent supports stay outside the enclosure.</text><rect x="24" y="24" width="600" height="450" class="reference"/><rect x="24" y="74" width="550" height="400" class="reference"/><rect x="123.5" y="274" width="161" height="200" class="corridor"/><rect x="84" y="124" width="240" height="190" class="reference"/><rect x="124" y="164" width="160" height="110" class="reference"/><rect x="121.5" y="274.5" width="165" height="22" class="ghost"/><rect x="394" y="119" width="160" height="110" class="reference"/><rect x="384" y="372" width="165" height="22" class="support"/><text x="204" y="216" text-anchor="middle">SUPPLIED ENCLOSURE</text><text x="204" y="223" class="small" text-anchor="middle">160 mm × 110 mm × 75 mm</text><text x="466.5" y="383" class="small" text-anchor="middle">front_gate / PARKED</text><text x="474" y="174" class="small" text-anchor="middle">FINISHED OUTPUT / KEEP ROUTE CLEAR</text><text x="204" y="374" class="small" text-anchor="middle">FRONT RELEASE / KEEP CLEAR</text><rect x="101.5" y="254" width="22" height="20" class="support"/><rect x="121.5" y="254" width="2" height="20" class="contact"/><text x="112.5" y="264" class="small" text-anchor="middle">left_front / brace</text><rect x="101.5" y="164" width="22" height="30" class="support"/><rect x="121.5" y="164" width="2" height="30" class="contact"/><text x="112.5" y="179" class="small" text-anchor="middle">left_rear / brace</text><rect x="284.5" y="249" width="22" height="25" class="support"/><rect x="284.5" y="249" width="2" height="25" class="contact"/><text x="295.5" y="261.5" class="small" text-anchor="middle">right_front / brace</text><rect x="284.5" y="164" width="22" height="30" class="support"/><rect x="284.5" y="164" width="2" height="30" class="contact"/><text x="295.5" y="179" class="small" text-anchor="middle">right_rear / brace</text><rect x="124" y="141.5" width="45" height="22" class="support"/><rect x="124" y="161.5" width="45" height="2" class="contact"/><text x="146.5" y="152.5" class="small" text-anchor="middle">rear_left / brace</text><rect x="239" y="141.5" width="45" height="22" class="support"/><rect x="239" y="161.5" width="45" height="2" class="contact"/><text x="261.5" y="152.5" class="small" text-anchor="middle">rear_right / brace</text><line x1="124" y1="244" x2="124" y2="209" stroke="#dc2626" stroke-width="1"/><text x="24" y="540" class="small">Joint zone J1: left, along-edge 30 mm–65 mm, relative height 8 mm–30 mm. Red marks are clearance references.</text><line x1="284" y1="239" x2="284" y2="209" stroke="#dc2626" stroke-width="1"/><text x="24" y="547" class="small">Joint zone J2: right, along-edge 35 mm–65 mm, relative height 8 mm–30 mm. Red marks are clearance references.</text><line x1="189" y1="164" x2="219" y2="164" stroke="#dc2626" stroke-width="1"/><text x="24" y="554" class="small">Joint zone J3: rear, along-edge 65 mm–95 mm, relative height 8 mm–30 mm. Red marks are clearance references.</text><line x1="164" y1="274" x2="204" y2="274" stroke="#dc2626" stroke-width="1"/><text x="24" y="561" class="small">Joint zone J4: front, along-edge 40 mm–80 mm, relative height 12 mm–30 mm. Red marks are clearance references.</text><text x="26" y="471" class="small">FRONT-LEFT ORIGIN (0,0) · +X right · +Y away</text><text x="24" y="488" class="small">Base origin X 60 mm, Y 160 mm. Enclosure centred; nominal contact gap 0.5 mm.</text><text x="24" y="496" class="small">Gate park origin X 360 mm, Y 80 mm; keep its entire foot and upright outside the release route.</text><text x="24" y="504" class="small">Finish joints first; release gate only when the completed assembly demonstrably retains itself. Then park gate and slide FRONT.</text><text x="24" y="512" class="small">Nominal jig-required assembly lift: 0 mm. Declared maximum assembly lift 8 mm must be physically verified.</text><text x="24" y="520" class="small">Workpiece family: supplied precut low-force interlocking panels, measured panel 3 mm, joint insertion 5 mm.</text><text x="24" y="528" class="small">No panel fabrication CAD is supplied. No strength, insertion-force, self-retention or independent-operation claim is established by this drawing.</text><rect x="24" y="602" width="50" height="50" class="cut"/><text x="49" y="625" text-anchor="middle">50 × 50 mm</text><text x="49" y="632" class="small" text-anchor="middle">SCALE CHECK</text><text x="82" y="610">Solid CUT · amber SCORE / FOLD · cyan REFERENCE</text><text x="82" y="618">Actual size / 100%. Measure both square edges.</text><text x="82" y="626">Oversize: use dimensioned ruler-marking instructions.</text><text x="82" y="634" class="small">Proposed jig; force, retention and access need trials.</text><text x="82" y="642" class="small">Revision 656b2d91295b3d51</text></svg>