# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Apply from codex/grounded-meta-loop, or main after the reviewed PR is merged.
# Review the selected paid instance/disk in Render before creating resources.
# The default Dockerfile starts the web process AND worker on this same disk.
previews:
  generation: "off"

services:
  - type: web
    name: countershot-api
    runtime: docker
    plan: standard
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    disk:
      name: countershot-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATA_ROOT
        value: /app/data
      - key: META_MODEL
        value: muse-spark-1.3
      - key: JOB_TIMEOUT_MS
        value: "120000"
      - key: MAX_CLIP_BYTES
        value: "52428800"
      - key: MODEL_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        # Public demo opens directly; browser cookies still isolate private work.
        value: ""
      # Bootstrap with BOTH origin settings absent. Once the real Render and
      # stable Vercel URLs are assigned, add APP_PUBLIC_ORIGIN and
      # PUBLIC_API_ORIGIN together in Render's environment settings.
      # COUNTERSHOT_BACKEND_ORIGIN belongs only on the Vercel frontend.
